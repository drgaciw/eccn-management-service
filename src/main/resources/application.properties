# Bean Override
spring.main.allow-bean-definition-overriding=true

# Application
spring.application.name=eccn-management-service

# Virtual Threads (Spring Boot 4 + Tomcat 11)
spring.threads.virtual.enabled=true

# MongoDB
spring.mongodb.uri=${MONGODB_URI:mongodb://localhost:27017/eccn_management}
spring.mongodb.authentication-database=admin
spring.mongodb.username=${MONGODB_USERNAME:root}
spring.mongodb.password=${MONGODB_PASSWORD:secret}
spring.data.mongodb.auto-index-creation=true

# Caching
spring.cache.type=simple

# Forwarded Headers Proxy Strategy
server.forward-headers-strategy=FRAMEWORK

# Async
spring.task.execution.pool.core-size=5
spring.task.execution.pool.max-size=10
spring.task.execution.pool.queue-capacity=100
spring.task.execution.thread-name-prefix=Async-Executor-

# Eureka Configuration
eureka.client.service-url.defaultZone=http://localhost:8761/eureka/
eureka.instance.health-check-url-path=/actuator/health
eureka.instance.hostname=localhost
eureka.instance.prefer-ip-address=true

# Actuator
management.endpoints.web.exposure.include=health,info,prometheus
management.endpoint.health.show-details=when-authorized
management.endpoint.health.probes.enabled=true
management.health.livenessstate.enabled=true
management.health.readinessstate.enabled=true

# OpenTelemetry Tracing
management.opentelemetry.resource-attributes.service.name=eccn-management-service
management.tracing.sampling.probability=0.1

# Security
spring.security.user.name=${SECURITY_ADMIN_NAME:admin}
spring.security.user.password=${SECURITY_ADMIN_PASSWORD:{noop}admin}
spring.security.user.roles=USER

# Logging
logging.level.root=INFO
logging.level.com.aciworldwide=DEBUG
logging.pattern.console=%d{yyyy-MM-dd HH:mm:ss} - %logger{36} - %msg%n

# API Documentation
springdoc.swagger-ui.path=/swagger-ui.html
springdoc.api-docs.path=/v3/api-docs
springdoc.packagesToScan=com.aciworldwide.eccn_management_service

# API Versioning (Spring Boot 4)
spring.mvc.apiversion.use.header=X-API-Version
spring.mvc.apiversion.default=1
spring.mvc.problemdetails.enabled=true

# LLM Council
eccn.council.members=openai/gpt-4.1,google/gemini-2.5-pro,anthropic/claude-sonnet-4.5
eccn.council.chairman=anthropic/claude-sonnet-4.5
