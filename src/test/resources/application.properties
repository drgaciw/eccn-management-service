# MongoDB Test Configuration
spring.mongodb.uri=mongodb://localhost:27017/testdb
spring.mongodb.authentication-database=admin
spring.mongodb.username=testuser
spring.mongodb.password=testpass

# Disable MongoDB auto-index creation for tests
spring.data.mongodb.auto-index-creation=false

# Enable bean definition overriding for tests
spring.main.allow-bean-definition-overriding=true

# Disable actuator endpoints for tests
management.endpoints.web.exposure.include=info,health
management.endpoint.health.show-details=never

# Disable Spring AI auto-configuration in tests (no API keys available)
spring.autoconfigure.exclude=org.springframework.ai.model.openai.autoconfigure.OpenAiChatAutoConfiguration,org.springframework.ai.model.google.genai.autoconfigure.chat.GoogleGenAiChatAutoConfiguration,org.springframework.ai.model.anthropic.autoconfigure.AnthropicChatAutoConfiguration

# Dummy Spring AI properties to prevent auto-configuration failures in tests
spring.ai.openai.api-key=test-dummy-key
spring.ai.google.genai.api-key=test-dummy-key
spring.ai.anthropic.api-key=test-dummy-key