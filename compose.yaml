services:
  mongodb:
    image: mongo:7.0
    container_name: eccn_mongodb
    ports:
      - "27017:27017"
    environment:
      MONGO_INITDB_ROOT_USERNAME: root
      MONGO_INITDB_ROOT_PASSWORD: secret
    volumes:
      - mongodb_data:/data/db
    healthcheck:
      test: ["CMD", "mongosh", "--eval", "db.adminCommand('ping')"]
      interval: 10s
      timeout: 5s
      retries: 5

  eccn-management-service:
    image: eccn-management-service:latest
    build: .
    ports:
      - "8080:8080"
    environment:
      SPRING_MONGODB_URI: mongodb://root:secret@mongodb:27017/eccn_management?authSource=admin
      OTEL_EXPORTER_OTLP_ENDPOINT: http://otel-collector:4318
    depends_on:
      mongodb:
        condition: service_healthy

  otel-collector:
    image: otel/opentelemetry-collector-contrib:0.156.0
    ports:
      - "4317:4317"
      - "4318:4318"

volumes:
  mongodb_data:
